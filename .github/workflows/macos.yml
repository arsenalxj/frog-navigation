name: macOS 原生测试

on:
  pull_request:
    branches: [main, master]
    paths: ['macos/**', 'windows/tests/fixtures/**', '.github/workflows/macos.yml']
  push:
    branches: [main, master]
    paths: ['macos/**', 'windows/tests/fixtures/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 运行 Swift 单元测试
        working-directory: macos
        run: swift test
