name: Windows 原生构建与检查

on:
  pull_request:
    branches: [main, master]
    paths: ['windows/**', 'assets/**', '.github/workflows/windows.yml']
  push:
    branches: [main, master]
    paths: ['windows/**', 'assets/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 构建、测试和打包 x64 Release
        shell: powershell
        run: ./windows/scripts/build.ps1
      - name: 验证安装包及旧名称升级
        shell: powershell
        run: ./windows/scripts/verify-package.ps1
      - name: 保存 Release ZIP 和测试记录
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frog-windows-x64
          path: |
            windows/dist/Frog-windows-x64.zip
            windows/build/Testing/Temporary/LastTest.log
            windows/build/Testing/artifacts/
            windows/build/verification/package-report.json
          if-no-files-found: warn
