<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>青蛙导航 · 传统色输入区</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FFFEF8;color:#0F1A20;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:20px 28px 14px;border-bottom:1px solid #E4DFD7}h1{font-size:21px;margin:0 0 6px}p{margin:0;color:#695E45;line-height:1.6}nav{display:flex;gap:12px;align-items:center;padding:14px 28px}button{flex:1;text-align:left;padding:11px 16px;border:1px solid #E4DFD7;border-radius:6px;color:#0F1A20;cursor:pointer;font:inherit;background:var(--band)}button strong{display:block;font-size:14px;margin-bottom:5px}button span{font-size:12px;color:#695E45}button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}a{color:#0D5E3A;text-decoration:none;white-space:nowrap;margin-left:12px}#note{padding:0 28px 12px}main{margin:0 28px 16px;border:1px solid #E4DFD7}iframe{display:block;width:100%;height:calc(100vh - 265px);min-height:360px;border:0}footer{padding:0 28px 16px;color:#695E45;font-size:12px}@media(max-width:700px){nav{flex-wrap:wrap}nav a{width:100%;margin-left:0}button{padding:8px}button span{display:block}iframe{height:60vh}}
</style>
</head>
<body>
<header><h1>B · 传统色输入区</h1><p>保持象牙白内容区，只用输入区底色区分页面。色值直接取自 zhongguo-traditional-colors 原始色库。</p></header>
<nav aria-label="选择预览页面">
<button data-scene="main-root" aria-pressed="true" style="--band:#DFECD5;--accent:#0D5E3A"><strong>主界面</strong><span>498 · 艾背绿 · #DFECD5</span></button>
<button data-scene="buffer-commands" aria-pressed="false" style="--band:#D0DFE6;--accent:#1661AB"><strong>自定义命令</strong><span>368 · 远天蓝 · #D0DFE6</span></button>
<button data-scene="buffer-calc" aria-pressed="false" style="--band:#F7E8AA;--accent:#862617"><strong>计算器</strong><span>002 · 杏仁黄 · #F7E8AA</span></button>
<a id="full" target="_blank" rel="noopener">单独打开原型 ↗</a>
</nav>
<p id="note">浅绿、灰蓝、暖黄分别对应导航、命令、计算。输入区文字不降低透明度，辅助提示对比度均 ≥ 4.5:1。</p>
<main><iframe id="preview" title="传统色输入区交互原型"></iframe></main>
<footer>网页原型与 macOS 原生界面的输入区配色和无缝布局已同步。可点击原型操作；上方按钮用于切换演示场景。</footer>
<script>
const params=new URLSearchParams(location.search);
let scene=['main-root','buffer-commands','buffer-calc'].includes(params.get('scene'))?params.get('scene'):'main-root';
function render(){
 document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===scene));
 const url='青蛙导航 回声终端.html?scene='+scene;
 document.getElementById('preview').src=url;
 document.getElementById('full').href=url;
 history.replaceState(null,'','?scene='+scene);
}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;render()});
render();
</script>
</body></html>
