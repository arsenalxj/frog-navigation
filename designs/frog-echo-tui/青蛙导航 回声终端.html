<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #FFFEF8;
    font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, "PingFang SC", monospace;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #root { height: 100%; }
  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .board {
    display: block;
    width: 100vw;
    height: 100vh;
    user-select: none;
  }
  .board text { user-select: none; }
  .board g { -webkit-tap-highlight-color: transparent; }
  .frog-caret {
    animation: frogBlink 1.05s steps(1, end) infinite;
  }
  @keyframes frogBlink {
    0%, 52% { opacity: 1; }
    53%, 100% { opacity: 0; }
  }
  .ime {
    font-family: "SF Mono", Menlo, Consolas, ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    position: fixed;
    left: 8px;
    bottom: 8px;
    width: 2px;
    height: 2px;
    opacity: 0;
    border: 0;
    outline: none;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    pointer-events: none;
  }
</style>
