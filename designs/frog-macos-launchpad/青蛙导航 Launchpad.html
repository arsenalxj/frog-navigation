<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青蛙导航 — macOS 书签启动台原型</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* ============ 设计令牌 ============ */
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
    --ease-spring: cubic-bezier(0.32, 0.72, 0.35, 1);
    --tile: 76px;
    --tile-radius: 18px;
  }
  /* 深色外观（默认） */
  [data-appearance="dark"] {
    --lp-veil: rgba(24, 24, 30, 0.42);
    --lp-label: rgba(255, 255, 255, 0.96);
    --lp-label-dim: rgba(255, 255, 255, 0.55);
    --lp-search-bg: rgba(255, 255, 255, 0.14);
    --lp-search-border: rgba(255, 255, 255, 0.22);
    --lp-search-text: rgba(255, 255, 255, 0.92);
    --lp-panel-bg: rgba(46, 46, 54, 0.72);
    --lp-panel-border: rgba(255, 255, 255, 0.14);
    --lp-field-bg: rgba(255, 255, 255, 0.10);
    --lp-menu-bg: rgba(40, 40, 48, 0.82);
    --lp-menu-hover: rgba(255, 255, 255, 0.12);
    --lp-dot: rgba(255, 255, 255, 0.35);
    --lp-dot-active: rgba(255, 255, 255, 0.95);
    --lp-accent: #0a84ff;
    --lp-danger: #ff453a;
    --lp-badge: #e8e8ed;
    --lp-badge-glyph: #3a3a3f;
    --menubar-bg: rgba(30, 30, 36, 0.45);
    --menubar-text: rgba(255, 255, 255, 0.92);
    --dock-bg: rgba(255, 255, 255, 0.16);
    --dock-border: rgba(255, 255, 255, 0.22);
  }
  /* 浅色外观 */
  [data-appearance="light"] {
    --lp-veil: rgba(235, 235, 240, 0.52);
    --lp-label: rgba(20, 20, 25, 0.92);
    --lp-label-dim: rgba(20, 20, 25, 0.5);
    --lp-search-bg: rgba(255, 255, 255, 0.55);
    --lp-search-border: rgba(0, 0, 0, 0.10);
    --lp-search-text: rgba(20, 20, 25, 0.9);
    --lp-panel-bg: rgba(246, 246, 248, 0.78);
    --lp-panel-border: rgba(0, 0, 0, 0.08);
    --lp-field-bg: rgba(255, 255, 255, 0.7);
    --lp-menu-bg: rgba(250, 250, 252, 0.86);
    --lp-menu-hover: rgba(0, 0, 0, 0.07);
    --lp-dot: rgba(0, 0, 0, 0.25);
    --lp-dot-active: rgba(0, 0, 0, 0.75);
    --lp-accent: #007aff;
    --lp-danger: #ff3b30;
    --lp-badge: #ffffff;
    --lp-badge-glyph: #48484d;
    --menubar-bg: rgba(250, 250, 252, 0.5);
    --menubar-text: rgba(20, 20, 25, 0.88);
    --dock-bg: rgba(255, 255, 255, 0.4);
    --dock-border: rgba(255, 255, 255, 0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    background: #000;
  }
  button { font-family: var(--font); border: none; background: none; cursor: pointer; color: inherit; }
  input { font-family: var(--font); border: none; outline: none; background: none; color: inherit; }

  /* ============ 桌面场景 ============ */
  .desktop {
    position: fixed; inset: 0; overflow: hidden;
    transition: filter 0.45s var(--ease-spring);
  }
  .wallpaper { position: absolute; inset: 0; transition: opacity 0.5s ease; }
  .wp-sequoia { background:
      radial-gradient(120% 90% at 18% 8%, #f5b76e 0%, transparent 46%),
      radial-gradient(110% 100% at 85% 12%, #e76e8c 0%, transparent 52%),
      radial-gradient(130% 110% at 78% 92%, #4a3d8f 0%, transparent 55%),
      radial-gradient(120% 100% at 10% 88%, #2f4d8a 0%, transparent 58%),
      linear-gradient(160deg, #31367c 0%, #8a3a6e 55%, #d96a52 100%);
  }
  .wp-graphite { background:
      radial-gradient(110% 90% at 20% 10%, #6a6f7a 0%, transparent 48%),
      radial-gradient(120% 110% at 82% 20%, #3c414d 0%, transparent 55%),
      radial-gradient(130% 120% at 70% 95%, #171a21 0%, transparent 60%),
      linear-gradient(155deg, #454b57 0%, #23262e 60%, #101218 100%);
  }
  .wp-lagoon { background:
      radial-gradient(120% 90% at 15% 12%, #63c8c0 0%, transparent 46%),
      radial-gradient(115% 100% at 85% 15%, #3d7fc4 0%, transparent 52%),
      radial-gradient(130% 110% at 75% 90%, #1c3d6e 0%, transparent 56%),
      linear-gradient(160deg, #2a6d8f 0%, #1f4d7a 55%, #14294e 100%);
  }

  /* 菜单栏 */
  .menubar {
    position: absolute; top: 0; left: 0; right: 0; height: 28px;
    display: flex; align-items: center; gap: 18px; padding: 0 14px;
    background: var(--menubar-bg);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    color: var(--menubar-text); font-size: 13px; z-index: 10;
  }
  .menubar .mb-app { font-weight: 700; }
  .menubar .mb-item { opacity: 0.85; font-size: 13px; }
  .menubar .mb-right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .menubar .mb-right svg { display: block; }

  /* 程序坞 */
  .dock-wrap {
    position: absolute; left: 0; right: 0; bottom: 10px;
    display: flex; justify-content: center; z-index: 10;
    transition: transform 0.4s var(--ease-spring), opacity 0.3s ease;
  }
  .dock {
    display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px;
    background: var(--dock-bg); border: 1px solid var(--dock-border);
    border-radius: 22px;
    backdrop-filter: blur(30px) saturate(1.7);
    -webkit-backdrop-filter: blur(30px) saturate(1.7);
    box-shadow: 0 12px 34px rgba(0,0,0,0.28);
  }
  .dock-icon {
    width: 52px; height: 52px; border-radius: 13px; position: relative;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.18s var(--ease-spring);
  }
  .dock-icon:hover { transform: translateY(-9px) scale(1.14); }
  .dock-icon .dock-tip {
    position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%);
    background: var(--lp-menu-bg); color: var(--lp-label); font-size: 12px;
    padding: 4px 10px; border-radius: 7px; white-space: nowrap;
    border: 1px solid var(--lp-panel-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
  }
  .dock-icon:hover .dock-tip { opacity: 1; }
  .dock-running { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--lp-label); }
  .dock-sep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--lp-panel-border); }
  .di { width: 100%; height: 100%; border-radius: 13px; display: flex; align-items: center; justify-content: center; color: #fff; }
  .di-frog { background: linear-gradient(145deg, #3a3d46, #17181d); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22); }
  .di-safari { background: linear-gradient(145deg, #4fc3f7, #1565c0); }
  .di-mail { background: linear-gradient(145deg, #64b5f6, #1e88e5); }
  .di-notes { background: linear-gradient(145deg, #fff176 30%, #eceff1 30%); color: #555; }
  .di-music { background: linear-gradient(145deg, #ff6482, #e5385b); }
  .di-settings { background: linear-gradient(145deg, #b0b6c0, #6d727c); }
  .di-trash { background: linear-gradient(145deg, #d7dbe2, #9aa0aa); }

  /* 桌面提示 */
  .desktop-hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: rgba(255,255,255,0.85); z-index: 5; pointer-events: none;
  }
  .desktop-hint h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; text-shadow: 0 2px 18px rgba(0,0,0,0.3); }
  .desktop-hint p { margin-top: 10px; font-size: 14px; opacity: 0.75; }

  /* ============ 启动台 ============ */
  .launchpad {
    position: fixed; inset: 0; z-index: 40;
    display: flex; flex-direction: column;
    background: var(--lp-veil);
    backdrop-filter: blur(64px) saturate(1.9);
    -webkit-backdrop-filter: blur(64px) saturate(1.9);
    opacity: 0; pointer-events: none;
    transition: opacity 0.34s var(--ease-spring);
  }
  .launchpad.open { opacity: 1; pointer-events: auto; }

  .lp-top {
    display: flex; align-items: center; justify-content: center;
    padding: 30px 0 8px; position: relative; flex: none;
  }
  .lp-search {
    display: flex; align-items: center; gap: 8px;
    width: 340px; height: 38px; padding: 0 14px;
    background: var(--lp-search-bg);
    border: 1px solid var(--lp-search-border);
    border-radius: 10px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    color: var(--lp-search-text);
    transition: box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .lp-search.focused { border-color: var(--lp-accent); box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--lp-accent) 32%, transparent); }
  .lp-search input { flex: 1; font-size: 15px; color: var(--lp-search-text); }
  .lp-search input::placeholder { color: var(--lp-label-dim); }
  .lp-search svg { color: var(--lp-label-dim); flex: none; }
  .lp-search-clear {
    width: 18px; height: 18px; border-radius: 50%; flex: none;
    background: var(--lp-label-dim); color: var(--lp-veil);
    display: flex; align-items: center; justify-content: center;
  }
  .lp-gear {
    position: absolute; left: calc(50% + 186px); top: 30px;
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: var(--lp-label-dim); transition: background 0.15s ease, color 0.15s ease;
  }
  .lp-gear:hover { background: var(--lp-menu-hover); color: var(--lp-label); }

  /* 网格与分页 */
  .lp-body { flex: 1; position: relative; overflow: hidden; }
  .lp-pages { position: absolute; inset: 0; display: flex; transition: transform 0.42s var(--ease-spring); }
  .lp-page { width: 100%; flex: none; display: flex; align-items: center; justify-content: center; padding: 8px 40px 20px; }
  .lp-grid { display: grid; gap: 22px 30px; align-content: center; }

  .lp-tile {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 108px; cursor: pointer; position: relative;
    animation: tileIn 0.4s var(--ease-spring) backwards;
  }
  @keyframes tileIn { from { opacity: 0; transform: scale(0.72); } }
  .lp-icon {
    width: var(--tile); height: var(--tile); border-radius: var(--tile-radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 600; color: #fff;
    box-shadow: 0 6px 18px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.28);
    transition: transform 0.16s var(--ease-spring), box-shadow 0.16s ease, outline-color 0.15s ease;
    outline: 2.5px solid transparent; outline-offset: 3px;
    position: relative; overflow: hidden;
  }
  .lp-tile:hover .lp-icon { transform: scale(1.06); }
  .lp-tile.drop-target .lp-icon { outline-color: var(--lp-accent); transform: scale(1.1); }
  .lp-tile.dragging { opacity: 0.35; }
  .lp-tile-name {
    font-size: 12.5px; font-weight: 500; color: var(--lp-label);
    text-shadow: 0 1px 6px rgba(0,0,0,0.28);
    max-width: 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: center; line-height: 1.3; padding: 1px 5px; border-radius: 5px;
  }
  [data-appearance="light"] .lp-tile-name { text-shadow: none; }
  .lp-tile-badge {
    font-size: 10px; color: var(--lp-label-dim);
    background: var(--lp-search-bg); border-radius: 4px; padding: 1px 6px;
    max-width: 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lp-name-input {
    width: 116px; font-size: 12.5px; text-align: center;
    background: var(--lp-field-bg); color: var(--lp-search-text);
    border: 1.5px solid var(--lp-accent); border-radius: 6px; padding: 2px 4px;
  }

  /* 整理态抖动与删除角标 */
  .lp-tile.jiggle .lp-icon { animation: jiggle 0.28s ease-in-out infinite alternate; }
  .lp-tile.jiggle:nth-child(2n) .lp-icon { animation-delay: -0.14s; animation-name: jiggleB; }
  @keyframes jiggle { from { transform: rotate(-1.6deg) translateY(-0.5px); } to { transform: rotate(1.6deg) translateY(0.5px); } }
  @keyframes jiggleB { from { transform: rotate(1.5deg) translateX(-0.5px); } to { transform: rotate(-1.5deg) translateX(0.5px); } }
  .lp-del {
    position: absolute; top: -7px; left: 12px; width: 24px; height: 24px;
    border-radius: 50%; background: var(--lp-badge); color: var(--lp-badge-glyph);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 3;
    animation: badgeIn 0.18s var(--ease-spring);
  }
  @keyframes badgeIn { from { transform: scale(0.4); opacity: 0; } }

  /* 添加书签功能图标 */
  .lp-add .lp-icon {
    background: var(--lp-search-bg); border: 1.5px dashed var(--lp-label-dim);
    color: var(--lp-label-dim); box-shadow: none;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .lp-add:hover .lp-icon { border-color: var(--lp-label); color: var(--lp-label); border-style: solid; }

  /* 文件夹 */
  .lp-folder-minis { display: grid; grid-template-columns: repeat(2, 19px); grid-auto-rows: 19px; gap: 5px; padding: 13px; width: 100%; height: 100%; align-content: center; justify-content: center; }
  .lp-mini { border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25); }
  .lp-folder .lp-icon { background: rgba(128,128,140,0.35); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .lp-folder-more { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; }

  /* 分页圆点 */
  .lp-dots { display: flex; gap: 10px; justify-content: center; padding: 14px 0 26px; flex: none; }
  .lp-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lp-dot); transition: background 0.2s ease, transform 0.2s ease; }
  .lp-dot.active { background: var(--lp-dot-active); transform: scale(1.25); }

  /* 文件夹展开面板 */
  .folder-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center;
    background: color-mix(in srgb, var(--lp-veil) 78%, transparent);
    backdrop-filter: blur(80px) saturate(1.9); -webkit-backdrop-filter: blur(80px) saturate(1.9);
    animation: fadeIn 0.26s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .folder-panel { margin-top: 150px; display: flex; flex-direction: column; align-items: center; animation: folderIn 0.3s var(--ease-spring); }
  @keyframes folderIn { from { opacity: 0; transform: scale(0.86) translateY(14px); } }
  .folder-name { font-size: 26px; font-weight: 700; color: var(--lp-label); text-shadow: 0 1px 8px rgba(0,0,0,0.25); margin-bottom: 26px; padding: 2px 12px; border-radius: 8px; }
  .folder-name-input { font-size: 24px; font-weight: 700; text-align: center; width: 300px; background: var(--lp-field-bg); color: var(--lp-search-text); border: 1.5px solid var(--lp-accent); border-radius: 8px; padding: 3px 10px; margin-bottom: 26px; }
  .folder-grid { display: grid; grid-template-columns: repeat(4, 108px); gap: 24px 26px; max-width: 560px; }
  .folder-grid .lp-tile { animation: none; }
  .folder-empty-hint { grid-column: 1 / -1; text-align: center; color: var(--lp-label-dim); font-size: 13px; padding: 12px 0 4px; }

  /* 创建文件夹预览 */
  .lp-tile.merge-preview .lp-icon { outline-color: var(--lp-accent); transform: scale(1.12); box-shadow: 0 0 0 8px color-mix(in srgb, var(--lp-accent) 22%, transparent), 0 6px 18px rgba(0,0,0,0.24); }

  /* ============ 右键菜单 ============ */
  .ctx-menu {
    position: fixed; z-index: 90; min-width: 200px; padding: 5px;
    background: var(--lp-menu-bg); border: 1px solid var(--lp-panel-border);
    border-radius: 11px; box-shadow: 0 14px 44px rgba(0,0,0,0.34);
    backdrop-filter: blur(36px) saturate(1.7); -webkit-backdrop-filter: blur(36px) saturate(1.7);
    color: var(--lp-label); font-size: 13px;
    animation: menuIn 0.14s var(--ease-spring);
  }
  @keyframes menuIn { from { opacity: 0; transform: scale(0.94); } }
  .ctx-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 11px; border-radius: 7px; font-size: 13px; color: var(--lp-label); text-align: left; position: relative; }
  .ctx-item:hover { background: var(--lp-accent); color: #fff; }
  .ctx-item:hover .ctx-sub { color: rgba(255,255,255,0.75); }
  .ctx-item.danger:hover { background: var(--lp-danger); }
  .ctx-item svg { flex: none; opacity: 0.8; }
  .ctx-sub { margin-left: auto; font-size: 11px; color: var(--lp-label-dim); }
  .ctx-sep { height: 1px; margin: 5px 11px; background: var(--lp-panel-border); }
  .ctx-submenu { position: fixed; z-index: 91; }

  /* ============ 弹窗（新增/编辑/删除确认） ============ */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(0,0,0,0.28);
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 0.18s ease;
  }
  .modal {
    width: 420px; padding: 24px;
    background: var(--lp-panel-bg); border: 1px solid var(--lp-panel-border);
    border-radius: 16px; box-shadow: 0 26px 70px rgba(0,0,0,0.4);
    backdrop-filter: blur(44px) saturate(1.7); -webkit-backdrop-filter: blur(44px) saturate(1.7);
    color: var(--lp-label);
    animation: modalIn 0.24s var(--ease-spring);
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.92) translateY(10px); } }
  .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 18px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 12px; color: var(--lp-label-dim); margin-bottom: 6px; }
  .modal-field input, .modal-field select {
    width: 100%; height: 34px; padding: 0 11px; font-size: 13.5px;
    background: var(--lp-field-bg); color: var(--lp-search-text);
    border: 1px solid var(--lp-panel-border); border-radius: 8px; outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    font-family: var(--font);
  }
  .modal-field select { appearance: none; cursor: pointer; }
  .modal-field select option { color: #222; }
  .modal-field input:focus, .modal-field select:focus { border-color: var(--lp-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lp-accent) 28%, transparent); }
  .modal-field input.error { border-color: var(--lp-danger); }
  .field-error { font-size: 11.5px; color: var(--lp-danger); margin-top: 5px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn { height: 30px; padding: 0 16px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: filter 0.15s ease, background 0.15s ease; }
  .btn:active { filter: brightness(0.9); }
  .btn-ghost { background: var(--lp-field-bg); color: var(--lp-label); border: 1px solid var(--lp-panel-border); }
  .btn-ghost:hover { background: var(--lp-menu-hover); }
  .btn-primary { background: var(--lp-accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-danger { background: var(--lp-danger); color: #fff; }
  .btn-danger:hover { filter: brightness(1.08); }
  .modal-warn { font-size: 12.5px; color: var(--lp-label-dim); line-height: 1.6; margin-top: 2px; }
  .modal-warn strong { color: var(--lp-danger); font-weight: 600; }

  /* ============ 设置面板 ============ */
  .settings {
    width: 560px; max-height: 78vh; display: flex; overflow: hidden;
    background: var(--lp-panel-bg); border: 1px solid var(--lp-panel-border);
    border-radius: 14px; box-shadow: 0 28px 80px rgba(0,0,0,0.44);
    backdrop-filter: blur(48px) saturate(1.7); -webkit-backdrop-filter: blur(48px) saturate(1.7);
    color: var(--lp-label); animation: modalIn 0.24s var(--ease-spring);
  }
  .settings-side { width: 168px; flex: none; padding: 16px 10px; border-right: 1px solid var(--lp-panel-border); display: flex; flex-direction: column; gap: 2px; background: color-mix(in srgb, var(--lp-field-bg) 40%, transparent); }
